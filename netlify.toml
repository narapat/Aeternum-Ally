[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Historical drafts contain public localhost/example URLs that can match
  # frontend environment values. Keep secret scanning enabled everywhere else.
  SECRETS_SCAN_OMIT_PATHS = "Archived/docs/phase-2-planning-2026-05/**"

[functions]
  included_files = ["Docs v1.1.0/**"]

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3000

# SPA fallback — both the tenant app and the admin portal are served from
# the same index.html; client-side routing handles the /admin split.
[[redirects]]
  from   = "/admin/*"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
